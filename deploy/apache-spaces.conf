# Spaces — an application from us beside the Business OS kernel (mcp-and-api.md §7). Rendered by the kernel's installer
# (bin/app_install.php): {{APP_FQDN}} = spaces.<domain>, {{APP_DIR}} = /srv/apps/spaces, the ports from config/.env.
# Two virtual hosts: the public name for people (and the two proxied MCP servers), and a loopback port for the kernel's
# actions server and approval replays.

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/spaces-error.log
	CustomLog ${APACHE_LOG_DIR}/spaces-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# Uploads: PHP's own 2 MB default would refuse every attachment and import above it, though the workspace's limit (sp_settings.max_attachment_bytes,
	# 25 MB by default; at most 1 GB) is the application's to apply — the module's ceiling is set above that default, the application enforces the setting (slice 8).
	<IfModule mod_php.c>
		php_admin_value upload_max_filesize 64M
		php_admin_value post_max_size 72M
	</IfModule>
	<IfModule mod_php8.c>
		php_admin_value upload_max_filesize 64M
		php_admin_value post_max_size 72M
	</IfModule>

	# The two read MCP servers (Phase 4), under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard
	# checks it against loopback). Bearer auth is the servers' own (a person's token, or the tenant's run token, or the kernel's).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# The health check: the only thing under /api.
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/v1/health\.php$ - [L]
	RewriteRule ^/api/ - [R=404,L]

	# The public door (design §4, D13) — no session; the hashed token is the authority; rate-limited; logged as portal:
	#   /p/<48 hex>                        a published page (and, when the publication includes them, its subpages)     (slice 2)
	#   /p/<48 hex>/<page uuid>            one subpage of the publication                                                (slice 2)
	#   /p/<48 hex>/files/<id>             an image or file the published page shows                                     (slice 2)
	RewriteRule ^/p/([a-f0-9]{48})/?$ /p.php?token=$1 [L,QSA]
	RewriteRule ^/p/([a-f0-9]{48})/files/([0-9]+)$ /p.php?token=$1&file=$2 [L,QSA]
	RewriteRule ^/p/([a-f0-9]{48})/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$ /p.php?token=$1&page=$2 [L,QSA]

	# The gated attachment door (a session, and the record's visibility — db/012 sp_can_see_attachment).
	RewriteRule ^/files/([0-9]+)$ /files.php?id=$1 [L,QSA]
	RewriteRule ^/files/([0-9]+)/thumb$ /files.php?id=$1&thumb=1 [L,QSA]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# A thread and its poll (slice 4): /channels/12/threads/345, /channels/12/threads/345/since.
	RewriteRule ^/channels/([0-9]+)/threads/([0-9]+)$ /channels/threads/view.php?id=$1&message=$2 [L,QSA]
	RewriteRule ^/channels/([0-9]+)/threads/([0-9]+)/since$ /channels/threads/since.php?id=$1&message=$2 [L,QSA]
	# A wiki's reports (slice 6): /spaces/3/wiki/report.
	RewriteRule ^/spaces/([0-9]+)/wiki/report$ /spaces/wiki/report.php?id=$1 [L,QSA]
	# Screens outside the canonical shape (the manifest, Phase 1): a page of a record (/channels/12/members, /spaces/3/members).
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	# UUID records (pages, databases): /pages/<uuid>, /pages/<uuid>/edit, /pages/<uuid>/history …; a version: /pages/<uuid>/versions/<n> (slice 3)
	RewriteRule ^/pages/([0-9a-f-]{36})/versions/([0-9]+)$ /pages/versions/view.php?id=$1&version=$2 [L,QSA]
	# A database's views and rows (slice 5): /databases/<uuid>/views/new, /databases/<uuid>/views/<uuid>/edit, /databases/<uuid>/rows/<uuid>
	RewriteRule ^/databases/([0-9a-f-]{36})/views/new$ /databases/views/form.php?id=$1 [L,QSA]
	RewriteRule ^/databases/([0-9a-f-]{36})/views/([0-9a-f-]{36})/edit$ /databases/views/form.php?id=$1&view=$2 [L,QSA]
	RewriteRule ^/databases/([0-9a-f-]{36})/rows/([0-9a-f-]{36})$ /databases/rows/view.php?id=$1&row=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(pages|databases)/([0-9a-f-]{36})/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(pages|databases)/([0-9a-f-]{36})$ /$1/view.php?id=$2 [L,QSA]

	# Canonical URLs (the action manifest, Phase 1): /x/new → form.php, /x/{id}/edit → form.php?id=, /x/{id} → view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/spaces-error.log
	CustomLog ${APACHE_LOG_DIR}/spaces-access.log combined
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/files/([0-9]+)$ /files.php?id=$1 [L,QSA]
	RewriteRule ^/spaces/([0-9]+)/wiki/report$ /spaces/wiki/report.php?id=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteRule ^/pages/([0-9a-f-]{36})/versions/([0-9]+)$ /pages/versions/view.php?id=$1&version=$2 [L,QSA]
	# A database's views and rows (slice 5): /databases/<uuid>/views/new, /databases/<uuid>/views/<uuid>/edit, /databases/<uuid>/rows/<uuid>
	RewriteRule ^/databases/([0-9a-f-]{36})/views/new$ /databases/views/form.php?id=$1 [L,QSA]
	RewriteRule ^/databases/([0-9a-f-]{36})/views/([0-9a-f-]{36})/edit$ /databases/views/form.php?id=$1&view=$2 [L,QSA]
	RewriteRule ^/databases/([0-9a-f-]{36})/rows/([0-9a-f-]{36})$ /databases/rows/view.php?id=$1&row=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(pages|databases)/([0-9a-f-]{36})/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(pages|databases)/([0-9a-f-]{36})$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
